name: Keep leaderboard database awake

# Free Supabase projects pause after 7 days without activity.
# This makes one tiny read twice a week so the leaderboard never goes to sleep.
on:
  schedule:
    - cron: "17 15 * * 1,4" # Mondays and Thursdays, 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ping Supabase
        run: |
          URL=$(jq -r '.supabase.url // ""' site/config.json)
          KEY=$(jq -r '.supabase.key // ""' site/config.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase not configured in site/config.json yet; nothing to ping."
            exit 0
          fi
          curl -fsS -X POST "${URL%/}/rest/v1/rpc/leaderboard" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{"p_limit": 1}'
          echo
          echo "Database is awake."
