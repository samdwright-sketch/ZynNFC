<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0F0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robotomy</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/peen-64.png">
<style>
  /* Robotomy lives on its own address (robotomy.samdw.ca). Opened straight
     from the PEEN home-screen app, iPhone treats that as leaving the app and
     shows browser controls. This page keeps it inside PEEN: Robotomy fills
     the screen in a frame, under the status bar. The login cookie is shared
     across samdw.ca, so it's signed in already. */
  html, body { margin: 0; height: 100%; background: #0C0F0B; overflow: hidden; }
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px);
    width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; background: #0C0F0B; }
</style>
</head>
<body>
<script src="../shared.js"></script>
<script>
(async () => {
  // Sign in first (on the hub), so Robotomy never has to bounce out of the frame.
  if ((await Samdw.online) && !(await Samdw.session())) {
    location.replace('../hub/?next=' + encodeURIComponent(location.href));
    return;
  }
  const f = document.createElement('iframe');
  f.src = 'https://robotomy.samdw.ca/?via=peen&framed=1';
  f.title = 'Robotomy';
  f.allow = 'clipboard-write; web-share';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
