<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe9dd">
<title>Request / submit</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/peen-64.png">
<link rel="apple-touch-icon" href="../icons/peen-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../peen.css">
</head>
<body>
<main class="home">
  <a class="back" href="../hub/">&larr; PEEN</a>
  <section class="win" id="request">
    <div class="titlebar"><span>Request / submit</span></div>
    <div class="body">
      <p class="note" style="margin:0 0 12px">Send Sam a request, an idea, or anything else. Only Sam sees it.</p>
      <form id="reqForm">
        <label for="reqCat">What is it?</label>
        <select id="reqCat" required>
          <option value="">Pick one...</option>
          <option value="3d-print">3D print idea</option>
          <option value="pottery">Pottery request</option>
          <option value="zyn-container">Zyn container</option>
          <option value="game-idea">New game idea</option>
          <option value="feature">New feature</option>
          <option value="other">Something else</option>
        </select>
        <div class="field"><label for="reqMsg">Details</label>
          <textarea id="reqMsg" maxlength="4000" placeholder="What, how big, what colour, by when, why it would be funny..." required></textarea></div>
        <div class="field"><label for="reqFiles">Pictures or files (up to 8, 20 MB each)</label>
          <input id="reqFiles" type="file" multiple accept="image/*,video/*,.pdf,.stl,.obj,.3mf,.txt,.zip">
          <ul class="files" id="reqFileList"></ul></div>
        <label class="check"><input type="checkbox" id="reqAnon"> Send anonymously (Sam won't see your name)</label>
        <button class="primary" id="reqBtn" type="submit">Send to Sam</button>
        <p class="err hidden" id="reqErr"></p>
        <p class="ok hidden" id="reqOk">Sent. Thanks!</p>
      </form>
    </div>
  </section>

  <footer data-peen-footer>powered by PEEN-<em>IS</em></footer>
</main>

<script src="../shared.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const show = (el, on) => el.classList.toggle('hidden', !on);
  const msg = (id, text) => { $(id).textContent = text || ''; show($(id), !!text); };

  // Signed-in only: anyone else signs in on the hub and comes back here.
  (async () => {
    if ((await Samdw.online) && !(await Samdw.session())) {
      location.replace('../hub/?next=' + encodeURIComponent(location.href));
    }
  })();

  // ---------- Request / submit ----------
  let reqFiles = [];
  const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  function renderReqFiles() {
    $('reqFileList').innerHTML = reqFiles.map((f, i) => `<li><span>${esc(f.name)} (${fmtSize(f.size)})</span><button type="button" data-i="${i}">Remove</button></li>`).join('');
  }
  $('reqFiles').addEventListener('change', (e) => {
    for (const f of e.target.files) {
      if (reqFiles.length >= 8) { msg('reqErr', 'Up to 8 attachments.'); break; }
      if (f.size > 20 * 1048576) { msg('reqErr', `${f.name} is over 20 MB.`); continue; }
      reqFiles.push(f);
    }
    e.target.value = ''; renderReqFiles();
  });
  $('reqFileList').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    reqFiles.splice(Number(b.dataset.i), 1); renderReqFiles();
  });
  $('reqForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cat = $('reqCat').value, text = $('reqMsg').value.trim();
    if (!cat) return msg('reqErr', 'Pick what it is.');
    if (!text) return msg('reqErr', 'Write a few words.');
    $('reqBtn').disabled = true; msg('reqErr', ''); show($('reqOk'), false);
    try {
      const files = [];
      for (let i = 0; i < reqFiles.length; i++) {
        $('reqBtn').textContent = `Uploading ${i + 1} of ${reqFiles.length}...`;
        files.push(await Samdw.upload(reqFiles[i]));
      }
      $('reqBtn').textContent = 'Sending...';
      const r = await Samdw.rpc('submit_request', { p_category: cat, p_message: text, p_anonymous: $('reqAnon').checked, p_files: files });
      if (r && r.error) return msg('reqErr', r.error);
      $('reqForm').reset(); reqFiles = []; renderReqFiles(); show($('reqOk'), true);
    } catch { msg('reqErr', "Couldn't send that. Check your connection and try again."); }
    finally { $('reqBtn').disabled = false; $('reqBtn').textContent = 'Send to Sam'; }
  });

})();
</script>
</body>
</html>
