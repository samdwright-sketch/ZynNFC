<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1726">
<title>Tap</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d1726; color: #8fa3bd;
    font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #5fd3b0; animation: p .8s ease-in-out infinite alternate; }
  @keyframes p { to { transform: scale(1.8); opacity: .3; } }
  a { color: #5fd3b0; }
</style>
</head>
<body>
<div class="dot" aria-label="Loading"></div>
<noscript><p>This page needs JavaScript. <a href="hub/">Open PEEN</a></p></noscript>
<script>
  // NFC tags point here (e.g. https://tap.samdw.ca/?t=abc123).
  // config.json "go" decides where taps land, so stickers never need rewriting.
  (async () => {
    const t = new URLSearchParams(location.search).get('t');
    let go = 'hub/';
    try {
      const res = await fetch('config.json', { cache: 'no-store' });
      const c = await res.json();
      if (typeof c.go === 'string' && c.go) go = c.go;
    } catch { /* fall back to the game */ }
    const dest = new URL(go, location.href);
    if (t && dest.origin === location.origin) dest.searchParams.set('t', t); // tag only travels on our own site
    location.replace(dest.href);
  })();
</script>
</body>
</html>
